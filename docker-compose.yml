# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lcsync
      POSTGRES_PASSWORD: lcsync
      POSTGRES_DB: lcsync
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lcsync']
      interval: 5s
      retries: 10
volumes:
  pgdata:
